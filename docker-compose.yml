services:

  mysql:
    image: mysql:8.4
    container_name: agritrade-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agritrade
      MYSQL_USER: saran
      MYSQL_PASSWORD: Saran@123
      MYSQL_ROOT_PASSWORD: Root@123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot@123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: agritrade-backend:latest
    container_name: agritrade-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agritrade
      SPRING_DATASOURCE_USERNAME: saran
      SPRING_DATASOURCE_PASSWORD: Saran@123
    ports:
      - "8080:8080"

volumes:
  mysql_data: